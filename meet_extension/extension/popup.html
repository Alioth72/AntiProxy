<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 220px; font-family: sans-serif; padding: 10px; text-align: center; }
    .status-box { 
        margin-top: 15px; padding: 10px; background: #f0f0f0; 
        border-radius: 5px; font-size: 11px; color: #333; min-height: 40px;
    }
    .danger-zone {
      margin-top: 15px; border: 1px solid #ffcccc; background: #fff5f5; padding: 10px; border-radius: 5px;
    }
    label { font-size: 12px; font-weight: bold; color: #d32f2f; }
  </style>
</head>
<body>
  <h3>Auto Snapper & AFK 📸</h3>
  
  <div class="danger-zone">
    <label>⚠️ AFK Mode</label><br>
    <div style="font-size:10px; color:#555; margin-bottom:5px;">Kick me if I don't reply in 10s</div>
    <input type="checkbox" id="afkToggle"> Enable Auto-Leave
  </div>

  <div id="log" class="status-box">Waiting for meeting...</div>

  <script src="popup.js"></script>
</body>
</html>
